data_cfg:
  dataset_name: Gait3D
  dataset_root: /home/zq/data/gait_data/Gait3D-multimodal # /home/zq/data/gait_data/Gait3D-pkls/Gait3D-sils-64-44-pkl
  dataset_partition: ./datasets/Gait3D/Gait3D.json
  num_workers: 1
  data_in_use: [True, True] # heatmap, sil
  remove_no_gallery: false # Remove probe if no gallery for it
  test_dataset_name: Gait3D

evaluator_cfg:
  enable_float16: true
  restore_ckpt_strict: true
  restore_hint: 60000
  save_name: GaitBase_DA_KDLogits_KLLoss_w1.0_scale16_T4.0_FeatsKD_ABLoss_w0.003_feat_num1_margin1.0_Teacher_DeepGaitV2_SkeletonGaitPP
  eval_func: evaluate_Gait3D
  sampler:
    batch_shuffle: false
    batch_size: 16
    sample_type: all_ordered # all indicates whole sequence used to test, while ordered means input sequence by its natural order; Other options:   fixed_unordered
    frames_all_limit: 720 # limit the number of sampled frames to prevent out of memory
  metric: euc # cos
  transform:
    - type: BaseSilCuttingTransform

loss_cfg:
  - loss_term_weight: 1.0
    margin: 0.2
    type: TripletLoss
    log_prefix: triplet
  - loss_term_weight: 1.0
    scale: 16
    type: CrossEntropyLoss
    log_prefix: softmax
    log_accuracy: true
  - loss_term_weight: 1.0
    T: 4.0
    scale: 16
    type: LogitsKD_KLLoss
    log_prefix: kd_logits_deepgaitv2
  - loss_term_weight: 0.003
    feat_num: 1
    margin: 1.0
    type: FeatsKD_ABLoss
    log_prefix: kd_feats_deepgaitv2
  - loss_term_weight: 1.0
    T: 4.0
    scale: 16
    type: LogitsKD_KLLoss
    log_prefix: kd_logits_SkeletonGaitPP
  - loss_term_weight: 0.003
    feat_num: 1
    margin: 1.0
    type: FeatsKD_ABLoss
    log_prefix: kd_feats_SkeletonGaitPP

model_cfg:
  model: Baseline
  backbone_cfg:
    type: ResNet9
    block: BasicBlock
    channels: # Layers configuration for automatically model construction
      - 64
      - 128
      - 256
      - 512
    layers: 
      - 1
      - 1
      - 1
      - 1
    strides:
      - 1
      - 2
      - 2
      - 1
    maxpool: false
  SeparateFCs:
    in_channels: 512
    out_channels: 256
    parts_num: 16
  SeparateBNNecks:
    class_num: 3000
    in_channels: 256
    parts_num: 16
  bin_num:
    - 16
  teachers:
    deepgaitv2:
      cfg_path: ./configs/deepgaitv2/DeepGaitV2_gait3d.yaml
    # swingait:
    #   cfg_path: ./configs/swingait/swingait3D_B1442C2_Gait3D.yaml
    SkeletonGaitPP:
      cfg_path: ./configs/skeletongait/skeletongait++_Gait3D.yaml

optimizer_cfg:
  lr: 0.1
  momentum: 0.9
  solver: SGD
  weight_decay: 0.0005

scheduler_cfg:
  gamma: 0.1
  milestones: # Learning Rate Reduction at each milestones
    - 20000
    - 40000
    - 50000
  scheduler: MultiStepLR
trainer_cfg:
  enable_float16: true # half_percesion float for memory reduction and speedup
  fix_BN: false
  with_test: true
  log_iter: 100
  restore_ckpt_strict: true
  restore_hint: 0
  save_iter: 20000
  save_name: GaitBase_DA_KDLogits_KLLoss_w1.0_scale16_T4.0_FeatsKD_ABLoss_w0.003_feat_num1_margin1.0_Teacher_DeepGaitV2_SkeletonGaitPP
  sync_BN: true
  total_iter: 60000
  sampler:
    batch_shuffle: true
    batch_size:
      - 32 # TripletSampler, batch_size[0] indicates Number of Identity
      - 4 #                 batch_size[1] indicates Samples sequqnce for each Identity
    # frames_num_fixed: 30 # fixed frames number for training
    # frames_num_max: 50 # max frames number for unfixed training
    # frames_num_min: 10 # min frames number for unfixed traing
    # sample_type: unfixed_unordered # fixed control input frames number, unordered for controlling order of input tensor; Other options: unfixed_ordered or all_ordered
    frames_num_fixed: 30 # fixed frames number for training
    frames_skip_num: 4
    sample_type: fixed_ordered # fixed control input frames number, unordered for controlling order of input tensor; Other options: unfixed_ordered or all_ordered
    type: TripletSampler
  transform:
    - type: Compose
      trf_cfg:
        - type: RandomPerspective
          prob: 0.2
        - type: BaseSilCuttingTransform
        - type: RandomHorizontalFlip
          prob: 0.2
        - type: RandomRotate
          prob: 0.2
